[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cci"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}

dependencies = [
    "requests",
    "types-requests",
    "pyyaml",
    "pinecone"
    
]

[project.optional-dependencies]
dev = [
    "mypy",
    "pytest",
    "pytest-cov",
    "types-PyYAML"
]

[project.scripts]
cci = "cci.__main__:main"

[tool.setuptools]

[tool.setuptools.packages.find]
where = ["src"]
include = ["cci"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
cci = ["py.typed"]